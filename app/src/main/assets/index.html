<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cebá el mate</title>
<style>
:root{
  --bg:#0a0a0a; --fg:#ece6d8; --mute:#8a8576; --yerba:#6f9a3c; --mate:#5a3a22; --agua:#d9c9a0; --bad:#d9643c;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{
  margin:0;height:100%;background:#0a0a0a;color:var(--fg);
  font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;
  display:flex;flex-direction:column;align-items:center;
  touch-action:none;user-select:none;-webkit-user-select:none;overflow:hidden;
}
header{display:flex;flex-direction:column;align-items:center;gap:10px;padding:18px 16px 6px}
#nada{display:block;width:84px;height:84px}
header p{margin:0;font-size:1.05rem;color:var(--mute)}
#hud{display:flex;justify-content:space-between;width:min(360px,90%);padding:10px 0;font-size:1rem}
#stage{flex:1;width:100%;position:relative;display:flex;align-items:flex-end;justify-content:center;padding-bottom:36px}
#scene{position:relative;width:200px;height:300px}
#pava{position:absolute;top:0;left:50%;font-size:56px;transform:translateX(-10%) rotate(-8deg);transition:transform .25s}
.pouring #pava{transform:translateX(-10%) rotate(-38deg)}
#chorro{position:absolute;top:58px;left:calc(50% - 6px);width:5px;height:0;background:var(--agua);border-radius:3px;transition:height .15s;opacity:.85}
.pouring #chorro{height:112px}
#mate{position:absolute;bottom:0;left:20px;width:160px;height:170px;border-radius:14px 14px 80px 80px/14px 14px 100px 100px;background:var(--mate);border:4px solid #7a5231;overflow:hidden}
#agua{position:absolute;left:0;right:0;bottom:0;height:0;background:linear-gradient(var(--agua),#b79d63)}
#zona{position:absolute;left:0;right:0;background:rgba(111,154,60,.45);border-top:2px solid var(--yerba);border-bottom:2px solid var(--yerba)}
#bombilla{position:absolute;bottom:60px;left:112px;width:5px;height:150px;background:#b8bcc2;border-radius:3px;transform:rotate(14deg);transform-origin:bottom}
#msg{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:24px;background:rgba(10,10,10,.88)}
#msg h2{margin:0;font-size:1.6rem}
#msg p{margin:0;color:var(--mute);max-width:300px;line-height:1.45}
#msg b{color:var(--yerba)}
#btn{margin-top:10px;padding:14px 34px;border-radius:30px;background:var(--yerba);color:#0a0a0a;font-weight:700;font-size:1.05rem}
.hide{display:none!important}
</style>
</head>
<body>
<header>
  <img id="nada" alt="" src="matesito.svg">
  <p>No hay conexion a internet</p>
</header>

<div id="hud"><span id="pts">Puntos: 0</span><span id="rec">Récord: 0</span><span id="vid">♥♥♥</span></div>

<div id="stage">
  <div id="scene">
    <div id="pava">🫖</div>
    <div id="chorro"></div>
    <div id="bombilla"></div>
    <div id="mate"><div id="zona"></div><div id="agua"></div></div>
  </div>
  <div id="msg">
    <h2 id="mt">Cebá el mate</h2>
    <p id="mp">Mantené el dedo apretado para echar agua. Soltá cuando llegue a la <b>zona verde</b>. Si se pasa, se lava la yerba.</p>
    <div id="btn">Empezar</div>
  </div>
</div>

<script>
(function(){
  var tactil = ('ontouchstart' in window) || navigator.maxTouchPoints > 0;
  var $ = function(i){return document.getElementById(i)};
  var stage=$('stage'), scene=$('scene'), agua=$('agua'), zona=$('zona'),
      msg=$('msg'), mt=$('mt'), mp=$('mp'), btn=$('btn');

  if(!tactil){
    mt.textContent='Solo para pantallas táctiles';
    mp.textContent='Abrí esta página en un celular o tablet para jugar.';
    btn.classList.add('hide');
    return;
  }

  var nivel=0, vertiendo=false, jugando=false, esperando=true;
  var ronda=0, puntos=0, vidas=3, rec=0, centro=.8, ancho=.09, last=0;
  try{ rec=+localStorage.getItem('mate_rec')||0; }catch(e){}

  function hud(){
    $('pts').textContent='Puntos: '+puntos;
    $('rec').textContent='Récord: '+rec;
    $('vid').textContent=new Array(vidas+1).join('♥')+new Array(4-vidas).join('♡');
  }

  function nuevaRonda(){
    ronda++; nivel=0;
    ancho=Math.max(.03,.09-.012*ronda);
    centro=.5+Math.random()*(.9-ancho-.5);
    var alto=document.getElementById('mate').clientHeight-8;
    zona.style.bottom=((centro-ancho)*100)+'%';
    zona.style.height=(ancho*2*100)+'%';
    agua.style.height='0%';
    hud();
  }

  function mostrar(titulo,texto,boton){
    jugando=false; vertiendo=false; scene.classList.remove('pouring');
    mt.textContent=titulo; mp.textContent=texto; btn.textContent=boton;
    msg.classList.remove('hide'); esperando=true;
  }

  function resolver(){
    jugando=false; scene.classList.remove('pouring');
    var dist=Math.abs(nivel-centro);
    if(nivel<1 && dist<=ancho){
      var gan=100+Math.round((1-dist/ancho)*100);
      puntos+=gan;
      if(puntos>rec){rec=puntos;try{localStorage.setItem('mate_rec',rec)}catch(e){}}
      hud();
      mostrar('¡Mate listo! +'+gan,'Ese está en su punto. Ahora viene uno más justo.','Seguir cebando');
    }else{
      vidas--; hud();
      var por = nivel>=1 ? 'Se rebalsó y se lavó la yerba.' : (nivel<centro ? 'Quedó flojo, casi puro agua tibia.' : 'Quedó muy lleno, no hay espuma.');
      if(vidas<=0){
        mostrar('Se acabó la yerba', por+' Hiciste '+puntos+' puntos.','Jugar de nuevo');
        ronda=0; puntos=0; vidas=3; hud(); ronda=-1;
      }else{
        mostrar('Ups', por,'Reintentar');
      }
    }
  }

  function loop(t){
    var dt=Math.min(.05,(t-last)/1000); last=t;
    if(jugando && vertiendo){
      nivel+=(.3+.05*ronda)*dt;
      if(nivel>=1){nivel=1;agua.style.height='100%';resolver();}
      else agua.style.height=(nivel*100)+'%';
    }
    requestAnimationFrame(loop);
  }

  function arrancar(e){
    e.preventDefault();
    if(!esperando) return;
    if(ronda<0){ronda=0;puntos=0;vidas=3;}
    esperando=false; msg.classList.add('hide');
    nuevaRonda(); jugando=true;
  }

  btn.addEventListener('touchstart',arrancar,{passive:false});

  stage.addEventListener('touchstart',function(e){
    e.preventDefault();
    if(!jugando) return;
    vertiendo=true; scene.classList.add('pouring');
  },{passive:false});

  function soltar(e){
    e.preventDefault();
    if(!jugando||!vertiendo) return;
    vertiendo=false;
    if(e.touches && e.touches.length>0) return;
    resolver();
  }
  stage.addEventListener('touchend',soltar,{passive:false});
  stage.addEventListener('touchcancel',soltar,{passive:false});

  // Sin mouse: se ignoran los eventos de puntero que no sean táctiles
  ['mousedown','mouseup','click'].forEach(function(n){
    document.addEventListener(n,function(e){e.preventDefault();e.stopPropagation();},true);
  });

  hud();
  requestAnimationFrame(function(t){last=t;loop(t);});
})();
</script>
</body>
</html>
